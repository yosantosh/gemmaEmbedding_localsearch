[project]
name = "localsearch-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "pypdf>=4.0",
  "imageio-ffmpeg>=0.5",  # static ffmpeg binary: frame sampling + audio slicing
  "sentence-transformers>=3.0",
  "torch>=2.3",
  "torchvision>=0.19",  # required by transformers' Gemma image processor
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
